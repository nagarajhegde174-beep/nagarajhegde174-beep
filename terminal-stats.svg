<svg xmlns="http://www.w3.org/2000/svg" width="600" height="520" viewBox="0 0 600 520">
  <style>
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes f1  { 0%,4%  {opacity:0} 5%,100%  {opacity:1} }
    @keyframes f2  { 0%,12% {opacity:0} 13%,100% {opacity:1} }
    @keyframes f3  { 0%,20% {opacity:0} 21%,100% {opacity:1} }
    @keyframes f4  { 0%,28% {opacity:0} 29%,100% {opacity:1} }
    @keyframes f5  { 0%,34% {opacity:0} 35%,100% {opacity:1} }
    @keyframes f6  { 0%,39% {opacity:0} 40%,100% {opacity:1} }
    @keyframes f7  { 0%,44% {opacity:0} 45%,100% {opacity:1} }
    @keyframes f8  { 0%,49% {opacity:0} 50%,100% {opacity:1} }
    @keyframes f9  { 0%,54% {opacity:0} 55%,100% {opacity:1} }
    @keyframes f10 { 0%,59% {opacity:0} 60%,100% {opacity:1} }
    @keyframes f11 { 0%,64% {opacity:0} 65%,100% {opacity:1} }
    @keyframes f12 { 0%,69% {opacity:0} 70%,100% {opacity:1} }
    @keyframes f13 { 0%,74% {opacity:0} 75%,100% {opacity:1} }
    @keyframes f14 { 0%,79% {opacity:0} 80%,100% {opacity:1} }
    @keyframes f15 { 0%,84% {opacity:0} 85%,100% {opacity:1} }
    @keyframes f16 { 0%,89% {opacity:0} 90%,100% {opacity:1} }
    @keyframes f17 { 0%,93% {opacity:0} 94%,100% {opacity:1} }
    @keyframes f18 { 0%,96% {opacity:0} 97%,100% {opacity:1} }
    .l1  {animation:f1  12s ease infinite;opacity:0}
    .l2  {animation:f2  12s ease infinite;opacity:0}
    .l3  {animation:f3  12s ease infinite;opacity:0}
    .l4  {animation:f4  12s ease infinite;opacity:0}
    .l5  {animation:f5  12s ease infinite;opacity:0}
    .l6  {animation:f6  12s ease infinite;opacity:0}
    .l7  {animation:f7  12s ease infinite;opacity:0}
    .l8  {animation:f8  12s ease infinite;opacity:0}
    .l9  {animation:f9  12s ease infinite;opacity:0}
    .l10 {animation:f10 12s ease infinite;opacity:0}
    .l11 {animation:f11 12s ease infinite;opacity:0}
    .l12 {animation:f12 12s ease infinite;opacity:0}
    .l13 {animation:f13 12s ease infinite;opacity:0}
    .l14 {animation:f14 12s ease infinite;opacity:0}
    .l15 {animation:f15 12s ease infinite;opacity:0}
    .l16 {animation:f16 12s ease infinite;opacity:0}
    .l17 {animation:f17 12s ease infinite;opacity:0}
    .l18 {animation:f18 12s ease infinite;opacity:0}
    .cursor{animation:blink 1s step-end infinite}
  </style>

  <!-- Terminal background -->
  <rect width="600" height="520" fill="#2d2b55" rx="10"/>

  <!-- Top bar -->
  <rect width="600" height="36" fill="#1e1c3a" rx="10"/>
  <rect x="0" y="24" width="600" height="12" fill="#1e1c3a"/>

  <!-- Traffic lights -->
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18" r="6" fill="#28c840"/>

  <!-- whoami command -->
  <text class="l1" x="20" y="65" font-family="Courier New,monospace" font-size="14">
    <tspan fill="#ff6ac1">nagarajhegde174-beep@git:~$ </tspan><tspan fill="#ffffff">whoami</tspan>
  </text>

  <!-- name output spaced -->
  <text class="l2" x="20" y="88" font-family="Courier New,monospace" font-size="14" fill="#57c7ff">N a g a r a j   H e g d e</text>

  <!-- git status command -->
  <text class="l3" x="20" y="114" font-family="Courier New,monospace" font-size="14">
    <tspan fill="#ff6ac1">nagarajhegde174-beep@git:~$ </tspan><tspan fill="#ffffff">git status</tspan>
  </text>

  <!-- GitHub Status italic -->
  <text class="l4" x="300" y="136" text-anchor="middle" font-family="Courier New,monospace" font-size="13" fill="#ff6ac1" font-style="italic">GitHub Status</text>

  <!-- Table outer border -->
  <rect class="l5" x="20" y="143" width="380" height="222" fill="none" stroke="#ff6ac1" stroke-width="1.5" rx="2"/>
  <!-- Header divider -->
  <line class="l5" x1="20" y1="172" x2="400" y2="172" stroke="#ff6ac1" stroke-width="1.2"/>
  <!-- Column divider -->
  <line class="l5" x1="200" y1="143" x2="200" y2="365" stroke="#ff6ac1" stroke-width="1.2"/>

  <!-- Table headers -->
  <text class="l5" x="105" y="163" text-anchor="middle" font-family="Courier New,monospace" font-size="13" font-weight="bold" fill="#ffffff">Title</text>
  <text class="l5" x="300" y="163" text-anchor="middle" font-family="Courier New,monospace" font-size="13" font-weight="bold" fill="#ffffff">Count</text>

  <!-- Table rows -->
  <text class="l6"  x="30" y="196" font-family="Courier New,monospace" font-size="13" fill="#a9a8c3">Stars</text>
  <text class="l6"  x="210" y="196" font-family="Courier New,monospace" font-size="13" fill="#5af78e">0</text>

  <text class="l7"  x="30" y="220" font-family="Courier New,monospace" font-size="13" fill="#a9a8c3">Forks</text>
  <text class="l7"  x="210" y="220" font-family="Courier New,monospace" font-size="13" fill="#5af78e">0</text>

  <text class="l8"  x="30" y="244" font-family="Courier New,monospace" font-size="13" fill="#a9a8c3">Commits</text>
  <text class="l8"  x="210" y="244" font-family="Courier New,monospace" font-size="13" fill="#5af78e">Growing...</text>

  <text class="l9"  x="30" y="268" font-family="Courier New,monospace" font-size="13" fill="#a9a8c3">Followers</text>
  <text class="l9"  x="210" y="268" font-family="Courier New,monospace" font-size="13" fill="#5af78e">0</text>

  <text class="l10" x="30" y="292" font-family="Courier New,monospace" font-size="13" fill="#a9a8c3">Pull Requests</text>
  <text class="l10" x="210" y="292" font-family="Courier New,monospace" font-size="13" fill="#5af78e">0</text>

  <text class="l11" x="30" y="316" font-family="Courier New,monospace" font-size="13" fill="#a9a8c3">Issues</text>
  <text class="l11" x="210" y="316" font-family="Courier New,monospace" font-size="13" fill="#5af78e">0</text>

  <text class="l12" x="30" y="340" font-family="Courier New,monospace" font-size="13" fill="#a9a8c3">Repository</text>
  <text class="l12" x="210" y="340" font-family="Courier New,monospace" font-size="13" fill="#5af78e">10</text>

  <text class="l13" x="30" y="362" font-family="Courier New,monospace" font-size="13" fill="#a9a8c3">Gists</text>
  <text class="l13" x="210" y="362" font-family="Courier New,monospace" font-size="13" fill="#5af78e">0</text>

  <!-- uptime command -->
  <text class="l14" x="20" y="392" font-family="Courier New,monospace" font-size="14">
    <tspan fill="#ff6ac1">nagarajhegde174-beep@git:~$ </tspan><tspan fill="#ffffff">uptime</tspan>
  </text>

  <!-- uptime value -->
  <text class="l15" x="20" y="415" font-family="Courier New,monospace" font-size="14" fill="#5af78e" font-weight="bold">Just Getting Started 🚀</text>

  <!-- exit command -->
  <text class="l16" x="20" y="441" font-family="Courier New,monospace" font-size="14">
    <tspan fill="#ff6ac1">nagarajhegde174-beep@git:~$ </tspan><tspan fill="#ffffff">exit</tspan>
  </text>

  <!-- exit output -->
  <text class="l17" x="20" y="464" font-family="Courier New,monospace" font-size="14" fill="#5af78e">exit</text>

  <!-- cursor -->
  <rect class="cursor l18" x="20" y="472" width="10" height="16" fill="#ff6ac1"/>
</svg>
